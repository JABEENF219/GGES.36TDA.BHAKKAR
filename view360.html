<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360° View — GGES 36 TDA BHAKKAR</title>
<meta name="description" content="Interactive 360-degree panoramic view of GGES 36 TDA Bhakkar — drag to look around every corner of the school.">
<meta name="theme-color" content="#0b6e4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e4f'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/vendor/pannellum.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="shell">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="nav.view360"></span>
      </nav>
      <p class="eyebrow" data-i18n="view360.eyebrow"></p>
      <h1 data-i18n="view360.title"></h1>
      <p data-i18n="view360.text"></p>
    </div>
  </section>

  <section class="section">
    <div class="shell">

      <!-- ---------------- interactive viewer ---------------- -->
      <div id="panoWrap" class="hide">
        <div class="pano-stage" id="panoStage">
          <!-- high-resolution still, shown until (and if) the interactive view is ready -->
          <img class="pano__fallback" id="panoFallback" alt="" decoding="async">
          <div class="pano" id="pano"></div>
          <div class="pano__loader" id="panoLoader">
            <span class="spinner" aria-hidden="true"></span>
            <span data-i18n="view360.loading"></span>
          </div>
          <p class="pano__note" id="panoNote" hidden></p>
        </div>

        <div class="pano-bar">
          <div class="pano-bar__group" role="group" aria-label="Viewer controls">
            <button class="pano-btn" id="panoZoomOut" type="button" data-i18n-title="view360.zoomOut" data-i18n-aria="view360.zoomOut"><span aria-hidden="true">−</span></button>
            <button class="pano-btn" id="panoZoomIn" type="button" data-i18n-title="view360.zoomIn" data-i18n-aria="view360.zoomIn"><span aria-hidden="true">+</span></button>
            <button class="pano-btn" id="panoReset" type="button" data-i18n-title="view360.reset" data-i18n-aria="view360.reset"><span aria-hidden="true">⟲</span></button>
            <button class="pano-btn" id="panoRotate" type="button" aria-pressed="true" data-i18n-title="view360.autorotate" data-i18n-aria="view360.autorotate"><span aria-hidden="true">⟳</span></button>
            <button class="pano-btn" id="panoFs" type="button" data-i18n-title="view360.fullscreen" data-i18n-aria="view360.fullscreen"><span aria-hidden="true">⛶</span></button>
          </div>
          <p class="pano-bar__hint" data-i18n="view360.drag"></p>
        </div>

        <div class="mt-3" id="panoChoose" style="display:none">
          <h2 class="small" data-i18n="view360.choose"></h2>
          <div class="pano-thumbs" id="panoThumbs"></div>
        </div>
      </div>

      <!-- ---------------- empty state ---------------- -->
      <div class="empty" id="panoEmpty" style="display:none">
        <div class="empty__icon">🌐</div>
        <h3 data-i18n="view360.empty"></h3>
        <p class="small mt-1" data-i18n="view360.emptyHint"></p>
        <a class="btn btn--primary btn--sm mt-3" href="admin.html" data-i18n="nav.admin"></a>
      </div>

      <!-- ---------------- how to shoot a panorama ---------------- -->
      <div class="panel mt-3" id="panoHow">
        <div class="panel__head"><h2 data-i18n="view360.howtoTitle"></h2></div>
        <ol class="howto">
          <li data-i18n="view360.howto1"></li>
          <li data-i18n="view360.howto2"></li>
          <li data-i18n="view360.howto3"></li>
        </ol>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/vendor/pannellum.js"></script>
<script>
(function () {
  'use strict';
  var $ = App.$, $$ = App.$$, esc = App.esc;
  App.init({ active: 'view360' });

  var START_HFOV = 100, MIN_HFOV = 35, MAX_HFOV = 120, AUTO_SPEED = -1.6, PANO_CAT = 'Panorama';

  var stage = $('#panoStage'), host = $('#pano');
  var fallback = $('#panoFallback'), loader = $('#panoLoader'), note = $('#panoNote');

  var viewer = null, list = [], idx = 0, autoOn = true, ready = false;
  var noteKey = null, signature = '', dragBound = false;

  function t(k) { return I18N.t(k); }

  function panoramas() {
    return Store.all('gallery').filter(function (g) {
      return (g.category || '') === PANO_CAT && g.src;
    });
  }

  /* the interactive view needs WebGL; anything older gets the still picture */
  function hasWebGL() {
    try {
      var c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) { return false; }
  }

  function setNote(key) {
    noteKey = key;
    if (!key) { note.hidden = true; note.textContent = ''; return; }
    note.hidden = false;
    note.textContent = t(key);
  }

  function destroyViewer() {
    if (viewer) {
      try { viewer.destroy(); } catch (e) {}
      viewer = null;
    }
    host.innerHTML = '';
    ready = false;
    stage.classList.remove('is-ready');
  }

  function applyAuto() {
    var btn = $('#panoRotate');
    btn.setAttribute('aria-pressed', String(autoOn));
    if (!viewer || !ready) return;
    if (autoOn) viewer.startAutoRotate(AUTO_SPEED);
    else viewer.stopAutoRotate();
  }

  function zoomBy(factor) {
    if (!viewer || !ready) return;
    var next = viewer.getHfov() * factor;
    viewer.setHfov(Math.max(MIN_HFOV, Math.min(MAX_HFOV, next)));
  }

  function reset() {
    if (!viewer || !ready) return;
    viewer.setHfov(START_HFOV);
    viewer.setPitch(0);
    viewer.setYaw(0);
  }

  /* ------------------------------------------------------------ show a scene */
  function start(i) {
    if (!list.length) return;
    idx = ((i % list.length) + list.length) % list.length;
    var item = list[idx];

    destroyViewer();
    loader.style.display = '';
    fallback.style.transform = '';
    fallback.style.touchAction = '';
    fallback.style.cursor = '';
    setNote(null);
    fallback.src = item.src;
    fallback.alt = item.title || '';
    paintThumbs();

    if (!window.pannellum || !hasWebGL()) {
      loader.style.display = 'none';
      setNote('view360.noWebgl');
      bindFallbackDrag();
      return;
    }

    try {
      viewer = window.pannellum.viewer('pano', {
        type: 'equirectangular',
        panorama: item.src,
        autoLoad: true,
        showControls: false,
        showZoomCtrl: false,
        showFullscreenCtrl: false,
        compass: false,
        hfov: START_HFOV,
        minHfov: MIN_HFOV,
        maxHfov: MAX_HFOV,
        pitch: 0,
        yaw: 0,
        autoRotate: AUTO_SPEED,
        autoRotateInactivityDelay: 4000,
        friction: 0.15
      });
    } catch (e) {
      loader.style.display = 'none';
      setNote('view360.noWebgl');
      bindFallbackDrag();
      return;
    }

    viewer.on('load', function () {
      ready = true;
      loader.style.display = 'none';
      stage.classList.add('is-ready');
      setNote(null);
      applyAuto();
    });

    viewer.on('error', function () {
      loader.style.display = 'none';
      setNote('view360.noWebgl');
    });
  }

  /* plain drag-to-pan, used only when the 3D engine is unavailable */
  function bindFallbackDrag() {
    if (dragBound) return;
    dragBound = true;
    var base = 0, from = 0, dragging = false;
    fallback.style.cursor = 'grab';
    fallback.style.touchAction = 'none';
    fallback.addEventListener('pointerdown', function (e) {
      dragging = true; from = e.clientX; base = parseFloat(fallback.dataset.pan || '0');
      try { fallback.setPointerCapture(e.pointerId); } catch (err) {}
      fallback.style.cursor = 'grabbing';
    });
    fallback.addEventListener('pointerup', function (e) {
      dragging = false;
      try { fallback.releasePointerCapture(e.pointerId); } catch (err) {}
      fallback.style.cursor = 'grab';
    });
    fallback.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var limit = fallback.clientWidth * 0.5;
      var x = Math.max(-limit, Math.min(limit, base + (e.clientX - from)));
      fallback.dataset.pan = String(x);
      fallback.style.transform = 'translateX(' + x + 'px)';
    });
  }

  /* ------------------------------------------------------------ thumbnails */
  function paintThumbs() {
    var box = $('#panoChoose'), thumbs = $('#panoThumbs');
    if (list.length < 2) { box.style.display = 'none'; return; }
    box.style.display = '';
    thumbs.innerHTML = list.map(function (g, i) {
      return '<button type="button" class="pano-thumb' + (i === idx ? ' is-active' : '') + '" data-i="' + i + '">' +
        '<img src="' + esc(g.src) + '" alt="" loading="lazy">' +
        '<span>' + esc(g.title || t('view360.title')) + '</span>' +
      '</button>';
    }).join('');
    $$('.pano-thumb', thumbs).forEach(function (b) {
      b.addEventListener('click', function () { start(parseInt(b.getAttribute('data-i'), 10)); });
    });
  }

  /* ----------------------------------------------------------------- paint */
  function paintAll() {
    list = panoramas();
    var has = list.length > 0;
    /* don't flash "nothing here" before the cloud data has arrived */
    var known = has || Store.isBooted();
    $('#panoWrap').classList.toggle('hide', !has);
    $('#panoEmpty').style.display = (!has && known) ? '' : 'none';

    if (!has) {
      destroyViewer();
      signature = '';
      paintThumbs();
      return;
    }
    var sig = list.map(function (g) { return g.id + '|' + g.src; }).join(',');
    if (sig === signature) return;   /* nothing changed, keep the current view running */
    signature = sig;
    start(Math.min(idx, list.length - 1));
  }

  $('#panoZoomIn').addEventListener('click', function () { zoomBy(1 / 1.3); });
  $('#panoZoomOut').addEventListener('click', function () { zoomBy(1.3); });
  $('#panoReset').addEventListener('click', reset);
  $('#panoRotate').addEventListener('click', function () { autoOn = !autoOn; applyAuto(); });
  $('#panoFs').addEventListener('click', function () {
    if (viewer && ready && viewer.toggleFullscreen) viewer.toggleFullscreen();
  });

  document.addEventListener('gges:langchange', function () {
    setNote(noteKey);
    paintThumbs();
  });

  /* subscribe paints immediately and then again on every live change */
  Store.subscribe('gallery', paintAll);
})();
</script>
</body>
</html>
