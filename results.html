<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Results — GGES 36 TDA BHAKKAR</title>
<meta name="description" content="Check annual examination results of GGES 36 TDA Bhakkar by roll number.">
<meta name="theme-color" content="#0b6e4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e4f'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="shell">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a><span>/</span><span data-i18n="nav.results"></span>
      </nav>
      <h1 data-i18n="results.title"></h1>
      <p data-i18n="results.text"></p>
    </div>
  </section>

  <section class="section">
    <div class="shell" style="max-width:74rem">

      <!-- lookup -->
      <div class="panel mb-3 no-print">
        <div class="row">
          <div class="field" style="flex:1;min-width:220px">
            <label for="roll" data-i18n="results.rollLabel"></label>
            <input class="input" id="roll" inputmode="numeric" data-i18n-ph="results.rollPh" autocomplete="off">
          </div>
          <div class="row" style="gap:.5rem;align-self:flex-end">
            <button class="btn btn--primary" id="checkBtn" data-i18n="results.check"></button>
            <button class="btn btn--ghost" id="clearBtn" data-i18n="results.clear"></button>
          </div>
          <span class="badge badge--live" data-i18n="common.live"></span>
        </div>
        <p class="tiny muted mt-2" id="rollHint"></p>
      </div>

      <!-- result card -->
      <div id="resultBox"></div>

      <!-- merit list -->
      <div class="panel mt-3">
        <div class="between mb-3">
          <h3 data-i18n="results.showingAll"></h3>
          <div class="row">
            <select class="select" id="classFilter" style="max-width:180px"></select>
            <select class="select" id="yearFilter" style="max-width:150px"></select>
            <button class="btn btn--outline btn--sm no-print" id="printList" data-i18n="common.print"></button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th data-i18n="results.position"></th>
                <th data-i18n="common.rollNo"></th>
                <th data-i18n="results.studentName"></th>
                <th data-i18n="common.class"></th>
                <th data-i18n="results.obtained"></th>
                <th data-i18n="results.percentage"></th>
                <th data-i18n="results.grade"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty mt-3" id="empty" style="display:none">
          <div class="empty__icon">📊</div>
          <h3 data-i18n="common.noData"></h3>
          <p class="small mt-1" data-i18n="results.emptyDb"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  var $ = App.$, $$ = App.$$, esc = App.esc;
  App.init({ active: 'results' });

  var classSel = 'all';
  var yearSel = 'all';

  function pct(r) {
    var t = parseFloat(r.totalMarks) || 0, o = parseFloat(r.obtainedMarks) || 0;
    return t ? Math.round((o / t) * 1000) / 10 : 0;
  }
  function grade(r) { return r.grade || Store.gradeFor(pct(r)); }

  /* --------------- merit list --------------- */
  function paintFilters() {
    var results = Store.all('results');
    var cls = {}, yrs = {};
    results.forEach(function (r) { cls[r.className] = 1; yrs[r.year || '—'] = 1; });
    $('#classFilter').innerHTML = '<option value="all">' + esc(I18N.t('students.allClasses')) + '</option>' +
      Object.keys(cls).sort(function (a, b) { return parseFloat(a) - parseFloat(b); })
        .map(function (c) { return '<option value="' + esc(c) + '">' + esc(I18N.lang() === 'ur' ? 'جماعت ' + c : 'Class ' + c) + '</option>'; }).join('');
    $('#classFilter').value = classSel;
    $('#yearFilter').innerHTML = '<option value="all">' + esc(I18N.t('results.year')) + ': ' + esc(I18N.t('common.all')) + '</option>' +
      Object.keys(yrs).sort().reverse().map(function (y) { return '<option value="' + esc(y) + '">' + esc(y) + '</option>'; }).join('');
    $('#yearFilter').value = yearSel;
  }

  function paintRows() {
    var list = Store.all('results').filter(function (r) {
      if (classSel !== 'all' && String(r.className) !== String(classSel)) return false;
      if (yearSel !== 'all' && String(r.year || '—') !== String(yearSel)) return false;
      return true;
    }).sort(function (a, b) { return pct(b) - pct(a); });

    $('#empty').style.display = list.length ? 'none' : '';
    $('#rows').innerHTML = list.map(function (r, i) {
      var g = grade(r);
      var pos = r.position || (i + 1);
      return '<tr>' +
        '<td class="cell-strong">#' + esc(pos) + '</td>' +
        '<td>' + esc(r.rollNo || '—') + '</td>' +
        '<td class="cell-strong">' + esc(r.studentName || '—') + '</td>' +
        '<td>' + esc(I18N.lang() === 'ur' ? 'جماعت ' + r.className : 'Class ' + r.className) + '</td>' +
        '<td>' + esc(r.obtainedMarks) + ' / ' + esc(r.totalMarks) + '</td>' +
        '<td>' + esc(pct(r)) + '%</td>' +
        '<td><span class="grade grade--' + esc(g) + '">' + esc(g) + '</span></td>' +
      '</tr>';
    }).join('');
  }

  /* --------------- lookup --------------- */
  function findResult(roll) {
    var list = Store.all('results');
    return list.filter(function (r) { return String(r.rollNo).toLowerCase() === String(roll).toLowerCase(); });
  }

  function paintResultCards(roll) {
    var box = $('#resultBox');
    if (!roll) { box.innerHTML = ''; return; }
    var found = findResult(roll);

    if (!found.length) {
      box.innerHTML = '<div class="empty"><div class="empty__icon">🔍</div>' +
        '<h3>' + esc(I18N.t('results.notFound')) + '</h3>' +
        '<p class="small mt-1">' + esc(I18N.t('results.notFoundHint')) + '</p></div>';
      return;
    }

    box.innerHTML = found.map(function (r) {
      var p = pct(r), g = grade(r);
      var student = Store.find('students', function (s) { return String(s.rollNo) === String(r.rollNo); });
      var rows = [
        [I18N.t('results.exam'), r.exam],
        [I18N.t('common.class'), r.className],
        [I18N.t('results.totalMarks'), r.totalMarks],
        [I18N.t('results.obtained'), r.obtainedMarks]
      ];
      return '<div class="result-card mb-3">' +
        '<div class="between" style="align-items:flex-start">' +
          '<div>' +
            '<span class="badge badge--gold">' + esc(I18N.t('results.printable')) + '</span>' +
            '<h3 class="mt-2">' + esc(r.studentName || (student ? student.name : '')) + '</h3>' +
            '<p class="muted small">' + esc(I18N.t('common.rollNo')) + ': ' + esc(r.rollNo) +
              ' · ' + esc(I18N.lang() === 'ur' ? 'جماعت ' + r.className : 'Class ' + r.className) + '</p>' +
          '</div>' +
          '<div class="row no-print">' +
            '<button class="btn btn--light btn--sm" onclick="window.print()">' + esc(I18N.t('results.printResult')) + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="result-card__rows">' +
          '<div><b>' + esc(p) + '%</b><span>' + esc(I18N.t('results.percentage')) + '</span></div>' +
          '<div><b class="grade--' + esc(g) + '" style="color:#f7dd9b">' + esc(g) + '</b><span>' + esc(I18N.t('results.grade')) + '</span></div>' +
          '<div><b>' + esc(r.position || '—') + '</b><span>' + esc(I18N.t('results.position')) + '</span></div>' +
          '<div><b>' + esc(r.totalMarks) + '</b><span>' + esc(I18N.t('results.totalMarks')) + '</span></div>' +
        '</div>' +
        '<div class="mt-3"><div class="marks-bar"><i style="width:' + esc(p) + '%"></i></div></div>' +
        '<div class="mt-3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem">' +
          rows.map(function (x) {
            return '<div style="background:rgba(255,255,255,.08);border-radius:10px;padding:.6rem .75rem">' +
              '<span class="tiny" style="color:#bcd8cc">' + esc(x[0]) + '</span>' +
              '<div style="font-weight:700">' + esc(x[1] || '—') + '</div></div>';
          }).join('') +
        '</div>' +
        (r.remarks ? '<p class="mt-3 small" style="color:#cfe7dd"><b>' + esc(I18N.t('results.remarks')) + ':</b> ' + esc(r.remarks) + '</p>' : '') +
      '</div>';
    }).join('');
  }

  function buildRollHint() {
    var rolls = Store.all('results').map(function (r) { return r.rollNo; }).filter(Boolean);
    $('#rollHint').textContent = rolls.length
      ? I18N.t('results.rollLabel') + ': ' + rolls.slice(0, 12).join(', ') + (rolls.length > 12 ? ' …' : '')
      : I18N.t('results.emptyDb');
  }

  $('#checkBtn').addEventListener('click', function () {
    var v = $('#roll').value.trim();
    paintResultCards(v);
    if (v) {
      var box = $('#resultBox');
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  $('#roll').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#checkBtn').click(); }
  });
  $('#clearBtn').addEventListener('click', function () {
    $('#roll').value = '';
    $('#resultBox').innerHTML = '';
  });
  $('#classFilter').addEventListener('change', function (e) { classSel = e.target.value; paintRows(); });
  $('#yearFilter').addEventListener('change', function (e) { yearSel = e.target.value; paintRows(); });
  $('#printList').addEventListener('click', function () { window.print(); });

  function paintAll() {
    paintFilters(); paintRows(); buildRollHint();
    var v = $('#roll').value.trim();
    if (v) paintResultCards(v);
  }
  paintAll();
  Store.subscribe('results', paintAll);
  document.addEventListener('gges:langchange', paintAll);
})();
</script>
</body>
</html>
